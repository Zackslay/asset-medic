<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Asset Medic</title>
  <desc id="desc">Find the reference. Review the replacement. Keep control. A free, local Roblox Studio plugin.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2e"/><stop offset="1" stop-color="#172b35"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#8bd8ff"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1140" cy="24" r="240" fill="#5eead4" opacity=".035"/>
  <circle cx="1050" cy="330" r="190" fill="#8bd8ff" opacity=".04"/>
  <rect x="52" y="52" width="6" height="28" rx="3" fill="#5eead4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="74" y="73" fill="#a9c5d1" font-size="16" font-weight="600" letter-spacing="3">ROBLOX STUDIO PLUGIN</text>
    <text x="48" y="156" fill="#f1f7fb" font-size="72" font-weight="700" letter-spacing="-2">Asset Medic</text>
    <text x="52" y="200" fill="#b4c8d4" font-size="23">Find where that asset is hiding.</text>
    <text x="52" y="233" fill="#b4c8d4" font-size="23">Replace it safely.</text>
    <rect x="52" y="280" width="236" height="34" rx="17" fill="#5eead4" opacity=".1"/>
    <text x="70" y="302" fill="#8cebdc" font-size="14" font-weight="600" letter-spacing="1">FREE / OPEN SOURCE / LOCAL</text>
    <rect x="670" y="66" width="478" height="228" rx="16" fill="#0c1423" stroke="#30475a"/>
    <text x="696" y="101" fill="#829fb0" font-size="13" font-weight="600" letter-spacing="2">YOUR WORKFLOW</text>
    <g fill="none" stroke="#30475a" stroke-width="1"><path d="M696 117h426M696 172h426M696 227h426"/></g>
    <g fill="#5eead4" font-size="16" font-weight="700"><text x="697" y="151">01</text><text x="697" y="206">02</text><text x="697" y="261">03</text></g>
    <g fill="#e4eef5" font-size="20" font-weight="600"><text x="740" y="152">Find references</text><text x="740" y="207">Review replacements</text><text x="740" y="262">Apply. Undo if needed.</text></g>
    <circle cx="1105" cy="93" r="4" fill="#5eead4"/>
  </g>
</svg>
